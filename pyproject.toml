[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mb-scrape"
version = "2.0.0"
description = "A robust, modular scraper for MagicBricks real estate and PG listings."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "crazycodeop"}
]
keywords = ["magicbricks", "web-scraper", "real-estate", "data-scraping", "python"]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
]

[project.scripts]
mb-scrape = "mb_scrape.cli:main"

[tool.setuptools.packages.find]
include = ["mb_scrape*"]
